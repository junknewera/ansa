[workspace]
members = ["crates/ansa", "crates/ansa-linux"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

[workspace.dependencies]
serde = { version = "1", default-features = false, features = ["std"] }
serde_json = { version = "1", default-features = false, features = ["std", "raw_value"] }
ring = "0.17"
rustix = { version = "1.1", default-features = false, features = ["std", "fs", "process", "thread", "pipe", "event"] }
libc = "0.2"
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "io-util", "sync", "macros"] }
tower-service = "0.3"
hyper = { version = "1", default-features = false, features = ["client", "http1", "http2", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["client-legacy", "client-proxy", "http1", "http2", "tokio"] }
http-body-util = "0.1"
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
