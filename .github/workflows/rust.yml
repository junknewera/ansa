name: Rust CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install the repository toolchain
        working-directory: rust
        run: rustup show active-toolchain
      - name: Check formatting
        working-directory: rust
        run: cargo fmt --all -- --check
      - name: Check Rust targets
        working-directory: rust
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test orchestration and recovery
        working-directory: rust
        run: cargo test --locked --test orchestration_run --test runtime_receipts
      - name: Build Carbon test adapter
        working-directory: rust
        run: cargo build --locked --features frontend-test-adapter --example frontend_adapter
      - name: Exercise Orchestrate+ through Carbon
        run: |
          python3 -B tests/carbon_workspace_pty.py \
            --binary rust/target/debug/examples/frontend_adapter \
            --case siwc-orchestrate-plus \
            --case siwc-orchestrate-plus-budget \
            --case siwc-orchestrate-plus-blocked \
            --case siwc-orchestrate-plus-implement \
            --case siwc-orchestrate-plus-blocked-rejected \
            --output "${RUNNER_TEMP}/carbon-plus"
